services:
  postgres:
    image: postgres:16-alpine
    container_name: devops-ticket-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket_system}
      POSTGRES_USER: ${POSTGRES_USER:-ticket_system}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: devops-ticket-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ticket_system:change_me_for_local_only@postgres:5432/ticket_system}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      MAX_API_BASE_URL: ${MAX_API_BASE_URL:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: devops-ticket-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
