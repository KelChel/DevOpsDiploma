name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Test, build, and smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticket_system
          POSTGRES_USER: ticket_system
          POSTGRES_PASSWORD: ticket_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_system -d ticket_system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: ci
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://ticket_system:ticket_system@localhost:5432/ticket_system
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci_only_replace_in_repository_settings' }}
      NOTIFICATION_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Basic Python quality check
        run: python -m compileall backend/app backend/tests database/migrations

      - name: Check Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker Compose
        env:
          POSTGRES_PORT: "55432"
          BACKEND_PORT: "18000"
          FRONTEND_PORT: "15173"
          DATABASE_URL: postgresql+asyncpg://ticket_system:change_me_for_local_only@postgres:5432/ticket_system
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci_only_replace_in_repository_settings' }}
          NOTIFICATION_PROVIDER: mock
        run: docker compose up -d postgres backend frontend

      - name: Smoke test backend health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:18000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Stop Docker Compose
        if: always()
        run: docker compose down --volumes --remove-orphans
